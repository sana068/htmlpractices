<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float property</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            background-color: aquamarine;
            height: 100vh;
            align-items: center;
            /* align-content: center; */
        }
        .box1{
            height: 234px;
            /* width:345px ; */
            background-color: blue;
            color: white;
            text-align: center;
             border: 2px solid black;
             order: 3;
             /* align-self: flex-end; */
             flex-grow: 1;
        }
        .box2{
            height: 234px;
            width:345px ;
            background-color: red;
            border: 2px solid black;
            color: white;
            align-items: center;
            text-align: center;
            /* flex-grow: 3; */
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="box1">box1</div>
    <div class="box2">box2</div>
     <div class="box2">box2b</div>
      <div class="box2">box2c</div>
    </div>
</body>
</html>
