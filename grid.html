<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS grid </title>
    <style>
        .container{
            display: grid;
            background-color:yellow;
            grid-row-gap: 2px; 
            grid-column-gap: 2px;
            height: 56vh;
            grid-template-columns:auto auto auto;
            grid-template-rows: auto auto auto ;
            /* grid-gap: 2px 9px; */
            /* justify-content: center; */
            /* align-content: baseline; */
            grid-row: 1 / span2;
        } 
        .item{
            background-color: beige;
            border: 2px solid red;
        }
.hr{
            background-color: blue;
            width: 566px;
        }
    </style>
</head>
<body>
  <div class="container">
    <div class="item">1- OVERTHINKING: </div>
    <div class="item">2- OVERTHINKING:</div>
    <div class="item">3- OVERTHINKING:</div>
    <div class="item">4- OVERTHINKING:</div>
    <div class="item">5- OVERTHINKING:</div>
    <div class="item">6- OVERTHINKING:</div>
    <div class="item">7- OVERTHINKING:</div>
    <div class="item">8- OVERTHINKING:</div>
    <div class="item">9- OVERTHINKING:</div>
    <div class="item">10- OVERTHINKING:</div>
    <div class="item">11- OVERTHINKING:</div>
    <div class="item">12- OVERTHINKING:</div>
  </div> 
  <hr>
</body>
</html>
