<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS</title>
    <style>
   </style>
</head>
<body>
    <div class="container">
       <h1>Registration</h1>
        <h4>Personal Details</h4>
        <div class="form-row">
         <div class="input-box">
        <label for="Full Name">Full Name</label><br>
        <input type="text"placeholder=" Enter your name">
    </div>
       <div class="input-box">
        <label for="Date Of Birth">Date Of Birth</label><br>
         <input type="date"placeholder=" Enter birth date">
        </div>
        <div class="input-box"> 
        <label for="Email">Email</label><br>
         <input type="text"placeholder=" Enter your email">
        </div>
        
        <div class="input-box">
           <label for="Mobile number">Mobile number</label><br>
           <input type="text" placeholder="Enter mobile number">
        </div>
          <div class="input-box">
             <label for="Gender">Gender</label><br>
            <input type="text" placeholder="Enter your gender">
        </div>
          <div class="input-box">
             <label for="Occupation">Occupation</label><br>
            <input type="text" placeholder="Enter occupation">
            </div>
            </div>
            <h4>Identity Details </h4>
            <div class="form-row"></div>
            <div class="input-box">
             <label for="ID Type">ID Type</label><br>
            <input type="text" placeholder="Enter ID Type">
            </div>
            <div class="input-box">
             <label for="ID Number">ID Number</label><br>
            <input type="text" placeholder="Enter ID Number">
            </div>
            <div class="input-box">
             <label for="Issue Authority">Issue Authority</label><br>
            <input type="text" placeholder="Enter issue department ">
            </div>
            <div class="input-box">
             <label for="Issue Date">Issue Date</label><br>
            <input type="date" placeholder="Enter ID issue date">
        </div>
            <div class="input-box">
             <label for="Issue State">Issue State</label><br>
            <input type="text" placeholder="Enter ID issue state ">
            </div>
            <div>
             <label for="Expiry Date">Expiry Date</label><br>
            <input type="date" placeholder="Enter ID expiry date ">
            </div>
          </div>
            <div>
                <button class="next-button" type="button"> 
                    Next &rarr;
                 </button>
            </div>
</body>
</html>
