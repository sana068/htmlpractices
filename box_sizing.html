<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin collapse</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box1{
            background-color: red;
            color: white;
            margin: 30px;
            height: 550px;
            width: 233px;
            border: 2px solid black; 
        }
        .box2{
            background-color:blue;
            color: white;
            /* margin: 20px; */
            height: 20px;
            width: 100%;
            padding: 6px;
            border: 5px solid grey;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugit voluptatibus ipsum vitae tempora sint voluptate perspiciatis, enim itaque, ratione quaerat illo incidunt maiores voluptates vero distinctio dicta et esse natus, quos nostrum ab a.
    <div class="box2"></div>
</body>
</html>
