<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation-2</title>
    <style>
        *{
            margin:0;
            padding: 0;
        }
     .container{
        height: 100vh;
        width: 100vw;
        background-color: aqua;
     }
     img{
         animation: widthAnimate 1s ease-in-out 0.5s infinite alternate ;
     }
     @keyframes widthAnimate {
        from{
            width: 30px;
            height:30px ;
        }
        to{
            width: 100vw;
            height: 100vh;
        }
     }
    </style>
</head>
<body>
    <div class="container">
        <img src="dragon.jpg" alt="" width="344px">
    </div>
</body>
</html>
